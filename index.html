    <script>
      // Apply saved appearance before first paint (avoids a light flash in dark mode).
      try {
        var raw = localStorage.getItem('learnflow-state-v1');
        var theme = (raw && JSON.parse(raw).settings && JSON.parse(raw).settings.theme) || 'system';
        if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
